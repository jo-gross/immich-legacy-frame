<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort erforderlich</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        
        .password-container {
            text-align: center;
            padding: 20px;
        }
        
        h1 {
            margin-bottom: 20px;
        }
        
        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            margin: 10px 0;
            width: 250px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #555;
        }
        
        .error {
            color: #ff0000;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <h1>Passwort erforderlich</h1>
        <form onsubmit="checkPassword(event)">
            <input type="password" id="password" placeholder="Passwort eingeben" required>
            <br>
            <button type="submit">Anmelden</button>
        </form>
        <div id="error" class="error" style="display: none;"></div>
    </div>
    
    <script>
        function checkPassword(event) {
            event.preventDefault();
            var password = document.getElementById('password').value;
            var errorDiv = document.getElementById('error');
            
            // Füge Passwort zur URL hinzu
            var url = window.location.pathname;
            var interval = new URLSearchParams(window.location.search).get('interval') || '5';
            url += '?password=' + encodeURIComponent(password) + '&interval=' + interval;
            
            // Lade Seite neu mit Passwort
            window.location.href = url;
        }
    </script>
</body>
</html>
