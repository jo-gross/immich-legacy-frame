<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immich Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #slideshow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slide {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
        }
        
        .slide.active {
            display: block;
        }
        
        .slide.fade-in {
            animation: fadeIn 1s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        #loading {
            color: #fff;
            font-size: 24px;
            text-align: center;
        }
        
        #error {
            color: #ff0000;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 5px;
        }
        
        #date-overlay {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #fff;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            display: none;
            text-align: right;
        }

        #date-overlay .photo-date {
            display: inline-block;
            line-height: 1.4;
            white-space: nowrap;
        }

        #date-overlay .album-name {
            display: block;
            font-size: 14px;
            margin-top: 5px;
            opacity: 0.9;
            line-height: 1.3;
            white-space: nowrap;
        }

        #date-overlay .location {
            display: block;
            font-size: 13px;
            margin-top: 5px;
            opacity: 0.85;
            line-height: 1.3;
            white-space: nowrap;
        }

        #current-time-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }

        #overlay-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            display: none;
            z-index: 1000;
        }

        #overlay-selector h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .overlay-item {
            color: #fff;
            margin: 8px 0;
            display: flex;
            align-items: center;
        }

        .overlay-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }

        .overlay-item label {
            cursor: pointer;
            flex: 1;
        }

        .overlay-item.interval-setting {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .overlay-item.interval-setting label {
            margin-right: 10px;
            flex: none;
        }

        #interval-input {
            width: 70px;
            padding: 5px 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        #interval-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.2);
        }

        #overlay-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
        }

        #overlay-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        #overlay-toggle {
            position: fixed;
            top: 20px;
            right: 90px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 999;
            display: none;
        }

        @media (max-width: 600px) {
            #overlay-toggle {
                right: 20px;
                top: 70px;
            }
        }
        
        #album-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }
        
        #album-selector h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #album-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
        }
        
        #album-close:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        
        .album-item {
            color: #fff;
            margin: 8px 0;
            display: flex;
            align-items: center;
        }
        
        .album-item input[type="checkbox"] {
            margin-right: 10px;
            width: 18px;
            height: 18px;
        }
        
        .album-item label {
            cursor: pointer;
            flex: 1;
        }
        
        #album-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            z-index: 999;
        }
        
        #album-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            margin-top: 10px;
        }
        
        .album-action-btn {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .album-action-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        #album-search-container {
            margin-bottom: 10px;
        }

        #album-search {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
        }

        #album-search:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background-color: rgba(255, 255, 255, 0.2);
        }

        #album-search::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #album-sort-container {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .album-sort-btn {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .album-sort-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .album-sort-btn.active {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        #album-count {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-bottom: 8px;
        }

        .overlay-item.order-setting {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            flex-direction: column;
            align-items: flex-start;
        }

        .overlay-item.order-setting label.order-label {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .order-options {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .order-option {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .order-option input[type="radio"] {
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        .order-option label {
            cursor: pointer;
            font-size: 13px;
        }
        
        #pause-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 48px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 10px;
            display: none;
            z-index: 1001;
        }
    </style>
</head>
<body>
    <div id="slideshow-container">
        <div id="loading">Lade Bilder...</div>
        <div id="error" style="display: none;"></div>
    </div>
    
    <button id="album-toggle" style="display: none;">Alben</button>
    <button id="overlay-toggle" style="display: none;">Overlays</button>

    <div id="album-selector">
        <h3>
            <span>Alben auswählen</span>
            <button id="album-close" title="Schließen">×</button>
        </h3>
        <div id="album-search-container">
            <input type="text" id="album-search" placeholder="Album suchen...">
        </div>
        <div id="album-sort-container">
            <button class="album-sort-btn active" id="sort-alpha-asc" title="A-Z">A-Z</button>
            <button class="album-sort-btn" id="sort-alpha-desc" title="Z-A">Z-A</button>
        </div>
        <div id="album-actions">
            <button class="album-action-btn" id="select-all-albums">Alle</button>
            <button class="album-action-btn" id="deselect-all-albums">Keine</button>
        </div>
        <div id="album-count"></div>
        <div id="album-list"></div>
    </div>
    
    <div id="overlay-selector">
        <h3>
            <span>Overlay-Optionen</span>
            <button id="overlay-close" title="Schließen">×</button>
        </h3>
        <div class="overlay-item">
            <input type="checkbox" id="show-photo-date" checked>
            <label for="show-photo-date">Aufnahmedatum anzeigen</label>
        </div>
        <div class="overlay-item">
            <input type="checkbox" id="show-current-time" checked>
            <label for="show-current-time">Aktuelle Uhrzeit anzeigen</label>
        </div>
        <div class="overlay-item">
            <input type="checkbox" id="show-album-name" checked>
            <label for="show-album-name">Album anzeigen</label>
        </div>
        <div class="overlay-item">
            <input type="checkbox" id="show-location" checked>
            <label for="show-location">Ort anzeigen</label>
        </div>
        <div class="overlay-item interval-setting">
            <label for="interval-input">Intervall (Sek.):</label>
            <input type="number" id="interval-input" min="1" max="300" value="{{ interval }}">
        </div>
        <div class="overlay-item order-setting">
            <label class="order-label">Reihenfolge:</label>
            <div class="order-options">
                <div class="order-option">
                    <input type="radio" id="order-random" name="photo-order" value="random" checked>
                    <label for="order-random">Zufällig</label>
                </div>
                <div class="order-option">
                    <input type="radio" id="order-sequential" name="photo-order" value="sequential">
                    <label for="order-sequential">Chronologisch</label>
                </div>
            </div>
        </div>
    </div>

    <div id="date-overlay"></div>
    <div id="current-time-overlay"></div>
    <div id="pause-overlay">⏸</div>
    
    <script>
        // Altbrowser-kompatible Implementierung
        (function() {
            'use strict';
            
            var container = document.getElementById('slideshow-container');
            var loading = document.getElementById('loading');
            var errorDiv = document.getElementById('error');
            var dateOverlay = document.getElementById('date-overlay');
            var currentTimeOverlay = document.getElementById('current-time-overlay');
            var albumSelector = document.getElementById('album-selector');
            var albumToggle = document.getElementById('album-toggle');
            var overlaySelector = document.getElementById('overlay-selector');
            var overlayToggle = document.getElementById('overlay-toggle');
            var pauseOverlay = document.getElementById('pause-overlay');
            var interval = {{ interval }};
            var slideInterval = null;
            var timeInterval = null;
            var currentImage = null;
            var isPaused = false;
            var selectedAlbums = []; // Leer = alle Alben
            var albums = [];
            var showPhotoDate = true;
            var showCurrentTime = true;
            var showAlbumName = true;
            var showLocation = true;
            var currentAlbumName = '';
            var currentLocation = '';
            var currentPhotoDate = '';
            var albumSortOrder = 'asc'; // 'asc' oder 'desc'
            var albumSearchTerm = '';
            var photoOrder = 'random'; // 'random' oder 'sequential'
            var sequentialIndex = 0; // Index für sequentiellen Modus

            // Hole Passwort aus URL falls vorhanden (altbrowser-kompatibel)
            function getQueryParam(name) {
                var url = window.location.search.substring(1);
                var params = url.split('&');
                for (var i = 0; i < params.length; i++) {
                    var pair = params[i].split('=');
                    if (pair[0] === name) {
                        return decodeURIComponent(pair[1] || '');
                    }
                }
                return null;
            }
            
            // Lade Alben
            function loadAlbums() {
                var password = getQueryParam('password');
                var url = '/api/albums';
                var hasQuery = false;
                if (password) {
                    url += '?password=' + encodeURIComponent(password);
                    hasQuery = true;
                }
                
                // Füge Immich-Parameter hinzu (URL + API-Key)
                url = appendImmichParams(url);

                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            albums = data.albums || [];
                            // Initialisiere Auswahl mit allen Alben
                            initializeSelectedAlbums();
                            renderAlbumSelector();
                        } catch (e) {
                            console.error('Error loading albums:', e);
                        }
                    }
                };
                xhr.send();
            }
            
            // Sortiere Alben
            function sortAlbums(albumsToSort, order) {
                var sorted = albumsToSort.slice(); // Kopie erstellen
                sorted.sort(function(a, b) {
                    var nameA = (a.name || 'Unbenannt').toLowerCase();
                    var nameB = (b.name || 'Unbenannt').toLowerCase();
                    if (nameA < nameB) return order === 'asc' ? -1 : 1;
                    if (nameA > nameB) return order === 'asc' ? 1 : -1;
                    return 0;
                });
                return sorted;
            }

            // Filtere Alben nach Suchbegriff
            function filterAlbums(albumsToFilter, searchTerm) {
                if (!searchTerm) return albumsToFilter;
                var term = searchTerm.toLowerCase();
                return albumsToFilter.filter(function(album) {
                    var name = (album.name || 'Unbenannt').toLowerCase();
                    return name.indexOf(term) !== -1;
                });
            }

            // Initialisiere selectedAlbums mit allen Album-IDs
            function initializeSelectedAlbums() {
                selectedAlbums = [];
                for (var i = 0; i < albums.length; i++) {
                    selectedAlbums.push(albums[i].id);
                }
            }

            // Rendere Album-Auswahl
            function renderAlbumSelector() {
                var albumList = document.getElementById('album-list');
                var albumCount = document.getElementById('album-count');
                albumList.innerHTML = '';
                
                // Filtere und sortiere
                var filteredAlbums = filterAlbums(albums, albumSearchTerm);
                var sortedAlbums = sortAlbums(filteredAlbums, albumSortOrder);
                
                // Zähle ausgewählte Alben
                var selectedCount = selectedAlbums.length;
                
                // Zeige Anzahl
                if (albumSearchTerm) {
                    albumCount.textContent = sortedAlbums.length + ' von ' + albums.length + ' Alben (' + selectedCount + ' ausgewählt)';
                } else {
                    albumCount.textContent = albums.length + ' Alben (' + selectedCount + ' ausgewählt)';
                }
                
                for (var i = 0; i < sortedAlbums.length; i++) {
                    var album = sortedAlbums[i];
                    var item = document.createElement('div');
                    item.className = 'album-item';
                    
                    var checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = 'album-' + album.id;
                    // Prüfe ob dieses Album in selectedAlbums ist
                    checkbox.checked = selectedAlbums.indexOf(album.id) !== -1;
                    checkbox.onchange = function(albumId) {
                        return function() {
                            toggleAlbumSelection(albumId);
                        };
                    }(album.id);
                    
                    var label = document.createElement('label');
                    label.htmlFor = 'album-' + album.id;
                    label.textContent = album.name || 'Unbenannt';
                    
                    item.appendChild(checkbox);
                    item.appendChild(label);
                    albumList.appendChild(item);
                }
            }
            
            // Toggle einzelnes Album in der Auswahl
            function toggleAlbumSelection(albumId) {
                var index = selectedAlbums.indexOf(albumId);
                if (index === -1) {
                    // Album hinzufügen
                    selectedAlbums.push(albumId);
                } else {
                    // Album entfernen
                    selectedAlbums.splice(index, 1);
                }
                // Aktualisiere Anzeige
                renderAlbumSelector();
                // Lade neues Bild mit neuen Filtern
                if (currentImage) {
                    loadRandomImage(false);
                }
            }
            
            // Alle sichtbaren Alben auswählen
            function selectAllAlbums() {
                var filteredAlbums = filterAlbums(albums, albumSearchTerm);
                for (var i = 0; i < filteredAlbums.length; i++) {
                    var albumId = filteredAlbums[i].id;
                    if (selectedAlbums.indexOf(albumId) === -1) {
                        selectedAlbums.push(albumId);
                    }
                }
                renderAlbumSelector();
                if (currentImage) {
                    loadRandomImage(false);
                }
            }
            
            // Alle sichtbaren Alben deselektieren
            function deselectAllAlbums() {
                var filteredAlbums = filterAlbums(albums, albumSearchTerm);
                for (var i = 0; i < filteredAlbums.length; i++) {
                    var albumId = filteredAlbums[i].id;
                    var index = selectedAlbums.indexOf(albumId);
                    if (index !== -1) {
                        selectedAlbums.splice(index, 1);
                    }
                }
                renderAlbumSelector();
                if (currentImage) {
                    loadRandomImage(false);
                }
            }

            // Album-Suche
            var albumSearchInput = document.getElementById('album-search');
            albumSearchInput.oninput = function() {
                albumSearchTerm = albumSearchInput.value;
                renderAlbumSelector();
            };

            // Sortier-Buttons
            var sortAlphaAsc = document.getElementById('sort-alpha-asc');
            var sortAlphaDesc = document.getElementById('sort-alpha-desc');

            sortAlphaAsc.onclick = function() {
                albumSortOrder = 'asc';
                sortAlphaAsc.className = 'album-sort-btn active';
                sortAlphaDesc.className = 'album-sort-btn';
                renderAlbumSelector();
            };

            sortAlphaDesc.onclick = function() {
                albumSortOrder = 'desc';
                sortAlphaAsc.className = 'album-sort-btn';
                sortAlphaDesc.className = 'album-sort-btn active';
                renderAlbumSelector();
            };
            
            // Toggle Album-Auswahl
            albumToggle.onclick = function() {
                if (albumSelector.style.display === 'none' || !albumSelector.style.display) {
                    albumSelector.style.display = 'block';
                    overlaySelector.style.display = 'none'; // Schließe Overlay-Auswahl
                } else {
                    albumSelector.style.display = 'none';
                }
            };
            
            // Toggle Overlay-Auswahl
            overlayToggle.onclick = function() {
                if (overlaySelector.style.display === 'none' || !overlaySelector.style.display) {
                    overlaySelector.style.display = 'block';
                    albumSelector.style.display = 'none'; // Schließe Album-Auswahl
                } else {
                    overlaySelector.style.display = 'none';
                }
            };

            // Schließe Album-Auswahl
            var albumClose = document.getElementById('album-close');
            albumClose.onclick = function() {
                albumSelector.style.display = 'none';
            };
            
            // Schließe Overlay-Auswahl
            var overlayClose = document.getElementById('overlay-close');
            overlayClose.onclick = function() {
                overlaySelector.style.display = 'none';
            };

            // Overlay-Optionen
            var showPhotoDateCheckbox = document.getElementById('show-photo-date');
            var showCurrentTimeCheckbox = document.getElementById('show-current-time');
            var showAlbumNameCheckbox = document.getElementById('show-album-name');
            var showLocationCheckbox = document.getElementById('show-location');

            // Aktualisiere Datum-Overlay basierend auf aktuellen Einstellungen
            function updateDateOverlay() {
                // Verwende globale Variable für das Datum
                var formattedDate = formatDate(currentPhotoDate);
                var hasDate = formattedDate && showPhotoDate;
                var hasAlbum = currentAlbumName && showAlbumName;
                var hasLocation = currentLocation && showLocation;

                if (hasDate || hasAlbum || hasLocation) {
                    var overlayContent = '';

                    if (hasDate) {
                        overlayContent += '<span class="photo-date">📷 ' + formattedDate + '</span>';
                    }

                    if (hasAlbum) {
                        overlayContent += '<span class="album-name">' + currentAlbumName + '</span>';
                    }

                    if (hasLocation) {
                        overlayContent += '<span class="location">📍 ' + currentLocation + '</span>';
                    }

                    dateOverlay.innerHTML = overlayContent;
                    dateOverlay.style.display = 'block';
                } else {
                    dateOverlay.style.display = 'none';
                }
            }

            showPhotoDateCheckbox.onchange = function() {
                showPhotoDate = showPhotoDateCheckbox.checked;
                updateDateOverlay();
            };

            showCurrentTimeCheckbox.onchange = function() {
                showCurrentTime = showCurrentTimeCheckbox.checked;
                updateCurrentTime();
            };

            showAlbumNameCheckbox.onchange = function() {
                showAlbumName = showAlbumNameCheckbox.checked;
                updateDateOverlay();
            };

            showLocationCheckbox.onchange = function() {
                showLocation = showLocationCheckbox.checked;
                updateDateOverlay();
            };

            // Intervall-Einstellung
            var intervalInput = document.getElementById('interval-input');
            intervalInput.onchange = function() {
                var newInterval = parseInt(intervalInput.value, 10);
                if (newInterval && newInterval >= 1 && newInterval <= 300) {
                    interval = newInterval;
                    // Starte Timer neu mit neuem Intervall (falls nicht pausiert)
                    if (!isPaused && slideInterval) {
                        clearTimeout(slideInterval);
                        slideInterval = setTimeout(function() {
                            loadRandomImage(false);
                        }, interval * 1000);
                    }
                } else {
                    // Ungültiger Wert, setze zurück
                    intervalInput.value = interval;
                }
            };

            // Reihenfolge-Einstellung
            var orderRandomRadio = document.getElementById('order-random');
            var orderSequentialRadio = document.getElementById('order-sequential');

            orderRandomRadio.onchange = function() {
                if (orderRandomRadio.checked) {
                    photoOrder = 'random';
                    sequentialIndex = 0; // Reset Index
                }
            };

            orderSequentialRadio.onchange = function() {
                if (orderSequentialRadio.checked) {
                    photoOrder = 'sequential';
                    sequentialIndex = 0; // Start von vorne
                }
            };

            // Alle auswählen / Keins auswählen Buttons
            var selectAllBtn = document.getElementById('select-all-albums');
            var deselectAllBtn = document.getElementById('deselect-all-albums');
            
            selectAllBtn.onclick = function() {
                selectAllAlbums();
            };
            
            deselectAllBtn.onclick = function() {
                deselectAllAlbums();
            };
            
            // Aktualisiere aktuelle Uhrzeit
            function updateCurrentTime() {
                if (!showCurrentTime) {
                    currentTimeOverlay.style.display = 'none';
                    return;
                }

                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var day = now.getDate();
                var month = now.getMonth() + 1;
                var year = now.getFullYear();

                var timeStr = (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;
                var dateStr = day + '.' + (month < 10 ? '0' : '') + month + '.' + year;

                currentTimeOverlay.textContent = timeStr + ' | ' + dateStr;
                currentTimeOverlay.style.display = 'block';
            }

            // Starte Uhrzeit-Update
            function startTimeUpdate() {
                updateCurrentTime();
                if (timeInterval) {
                    clearInterval(timeInterval);
                }
                timeInterval = setInterval(updateCurrentTime, 1000);
            }

            // Pause/Play Funktion
            function togglePause() {
                isPaused = !isPaused;
                if (isPaused) {
                    pauseOverlay.style.display = 'block';
                    albumToggle.style.display = 'block'; // Zeige Album-Button bei Pause
                    overlayToggle.style.display = 'block'; // Zeige Overlay-Button bei Pause
                    if (slideInterval) {
                        clearTimeout(slideInterval);
                        slideInterval = null;
                    }
                } else {
                    pauseOverlay.style.display = 'none';
                    albumToggle.style.display = 'none'; // Verstecke Album-Button bei Play
                    overlayToggle.style.display = 'none'; // Verstecke Overlay-Button bei Play
                    albumSelector.style.display = 'none'; // Schließe Album-Auswahl
                    overlaySelector.style.display = 'none'; // Schließe Overlay-Auswahl
                    // Starte Timer neu
                    if (slideInterval) {
                        clearTimeout(slideInterval);
                    }
                    slideInterval = setTimeout(function() {
                        loadRandomImage(false);
                    }, interval * 1000);
                }
            }
            
            // Klick auf Bild = Pause
            container.onclick = function(e) {
                // Nur wenn auf das Bild selbst geklickt wird, nicht auf Container
                if (e.target === currentImage || e.target === container) {
                    togglePause();
                }
            };
            
            // Hilfsfunktion: hänge Immich-Parameter an eine URL an
            function appendImmichParams(url) {
                var immichUrlParam = getQueryParam('immich_url');
                var immichApiKeyParam = getQueryParam('immich_api_key');

                var hasQuery = url.indexOf('?') !== -1;
                if (immichUrlParam) {
                    url += (hasQuery ? '&' : '?') + 'immich_url=' + encodeURIComponent(immichUrlParam);
                    hasQuery = true;
                }
                if (immichApiKeyParam) {
                    url += (hasQuery ? '&' : '?') + 'immich_api_key=' + encodeURIComponent(immichApiKeyParam);
                    hasQuery = true;
                }
                return url;
            }

            // Lade nächstes Bild
            function loadRandomImage(showLoading) {
                if (isPaused) {
                    return; // Nicht laden wenn pausiert
                }
                
                // Zeige Loading nur beim ersten Laden oder wenn explizit gewünscht
                if (showLoading !== false && !currentImage) {
                    loading.style.display = 'block';
                    loading.textContent = 'Lade Bild...';
                }
                
                var password = getQueryParam('password');
                var url = '/api/next-image';
                var hasQuery = false;
                if (password) {
                    url += '?password=' + encodeURIComponent(password);
                    hasQuery = true;
                }
                
                // Füge Album-Filter hinzu
                if (selectedAlbums.length > 0) {
                    url += (hasQuery ? '&' : '?') + 'albums=' + selectedAlbums.join(',');
                    hasQuery = true;
                }

                // Füge Reihenfolge-Parameter hinzu
                url += (hasQuery ? '&' : '?') + 'order=' + photoOrder;
                hasQuery = true;

                // Füge Index für sequentiellen Modus hinzu
                if (photoOrder === 'sequential') {
                    url += '&index=' + sequentialIndex;
                }
                
                // Füge Immich-Parameter hinzu (URL + API-Key)
                url = appendImmichParams(url);

                var xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                if (data.id && data.url) {
                                    // Speichere neuen Index für sequentiellen Modus
                                    if (typeof data.next_index !== 'undefined') {
                                        sequentialIndex = data.next_index;
                                    }
                                    displayImage(data.id, data.url, data.date, data.album, data.location, showLoading);
                                } else {
                                    showError('Ungültige Bilddaten erhalten');
                                }
                            } catch (e) {
                                showError('Fehler beim Parsen der Antwort: ' + e.message);
                            }
                        } else if (xhr.status === 401) {
                            showError('Ungültiges Passwort oder nicht autorisiert');
                        } else {
                            var errorMsg = 'Fehler beim Laden des Bildes: ' + xhr.status;
                            try {
                                var errorData = JSON.parse(xhr.responseText);
                                if (errorData.error) {
                                    errorMsg += ' - ' + errorData.error;
                                }
                            } catch (e) {
                                errorMsg += ' - ' + xhr.responseText.substring(0, 100);
                            }
                            showError(errorMsg);
                        }
                    }
                };
                xhr.onerror = function() {
                    showError('Netzwerkfehler beim Laden des Bildes');
                };
                xhr.send();
            }
            
            // Formatiere Datum
            function formatDate(dateString) {
                if (!dateString) return '';

                // Prüfe ob Datum bereits im Format dd.MM.yyyy ist
                if (/^\d{2}\.\d{2}\.\d{4}$/.test(dateString)) {
                    return dateString;
                }

                try {
                    var date = new Date(dateString);
                    // Prüfe ob Datum gültig ist
                    if (isNaN(date.getTime())) {
                        return '';
                    }
                    var day = date.getDate();
                    var month = date.getMonth() + 1;
                    var year = date.getFullYear();
                    return (day < 10 ? '0' : '') + day + '.' + (month < 10 ? '0' : '') + month + '.' + year;
                } catch (e) {
                    return '';
                }
            }
            
            // Zeige Bild an
            function displayImage(imageId, imageUrl, dateString, albumName, location, showLoading) {
                // Erstelle neues Bild-Element
                var img = new Image();
                var password = getQueryParam('password');
                
                // Verwende Proxy-Endpoint mit Konvertierung
                var proxyUrl = '/api/image/' + imageId + '?convert=true';
                if (password) {
                    proxyUrl += '&password=' + encodeURIComponent(password);
                }
                
                // Füge Immich-Parameter hinzu (URL + API-Key)
                proxyUrl = appendImmichParams(proxyUrl);

                img.onload = function() {
                    var isFirstImage = !currentImage;
                    
                    // Verstecke Loading nur wenn es angezeigt wurde
                    if (showLoading !== false || isFirstImage) {
                        loading.style.display = 'none';
                    }
                    
                    // Speichere Metadaten im Bild-Element
                    img.setAttribute('data-date', dateString || '');
                    img.setAttribute('data-album', albumName || '');
                    img.setAttribute('data-location', location || '');

                    // Aktualisiere globale Variablen
                    currentAlbumName = albumName || '';
                    currentLocation = location || '';
                    currentPhotoDate = dateString || '';

                    // Zeige neues Bild
                    img.className = 'slide active';
                    
                    if (isFirstImage) {
                        // Erstes Bild: fade-in
                        img.classList.add('fade-in');
                        container.appendChild(img);
                        currentImage = img;
                        
                        // Aktualisiere Overlays NACH dem Setzen von currentImage
                        updateDateOverlay();
                        
                        setTimeout(function() {
                            if (img) {
                                img.classList.remove('fade-in');
                            }
                        }, 1000);
                    } else {
                        // Beim Wechsel: Fade-out altes, dann neues anzeigen
                        currentImage.style.opacity = '0';
                        
                        // Aktualisiere Overlays sofort (vor der Animation)
                        updateDateOverlay();
                        
                        setTimeout(function() {
                            // Entferne altes Bild
                            if (currentImage && currentImage.parentNode) {
                                container.removeChild(currentImage);
                            }
                            
                            // Zeige neues Bild
                            img.style.opacity = '0';
                            container.appendChild(img);
                            currentImage = img;
                            
                            // Fade-in neues Bild
                            setTimeout(function() {
                                if (img) {
                                    img.style.opacity = '1';
                                }
                            }, 10);
                        }, 500);
                    }

                    // Starte Timer für nächstes Bild (nur wenn nicht pausiert)
                    if (!isPaused) {
                        if (slideInterval) {
                            clearTimeout(slideInterval);
                        }
                        slideInterval = setTimeout(function() {
                            loadRandomImage(false); // Kein Loading beim Wechsel
                        }, interval * 1000);
                    }
                };
                
                img.onerror = function() {
                    if (showLoading !== false || !currentImage) {
                        loading.style.display = 'none';
                    }
                    showError('Fehler beim Laden des Bildes');
                };
                
                img.src = proxyUrl;
            }
            
            // Zeige Fehler
            function showError(message) {
                loading.style.display = 'none';
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                
                // Versuche nach 5 Sekunden erneut
                setTimeout(function() {
                    errorDiv.style.display = 'none';
                    loadRandomImage();
                }, 5000);
            }
            
            // Starte beim Laden der Seite
            loadAlbums();
            startTimeUpdate();
            loadRandomImage();
        })();
    </script>
</body>
</html>
